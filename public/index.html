<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicBot Overseer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus+Jakarta+Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .active-glow { box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); border-color: rgba(56, 189, 248, 0.3); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-[#0b0f1a] text-slate-200 min-h-screen overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Simple SVG Icons
        const Icons = {
            Music: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>,
            Search: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
            LayoutGrid: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>,
            Play: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>,
            Activity: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>,
            Cpu: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="15" x2="23" y2="15"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="15" x2="4" y2="15"></line></svg>,
            Info: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        };

        const StatCard = ({ title, value, icon: IconName, color }) => {
            const Icon = Icons[IconName];
            return (
                <div className="glass p-5 rounded-2xl flex items-center gap-4">
                    <div className={`p-3 rounded-xl bg-${color}-500/10 text-${color}-400`}>
                        <Icon />
                    </div>
                    <div>
                        <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">{title}</p>
                        <p className="text-2xl font-bold">{value}</p>
                    </div>
                </div>
            );
        };

        const NodeCard = ({ node }) => (
            <div className="glass p-4 rounded-xl flex flex-col gap-2">
                <div className="flex justify-between items-center">
                    <span className="font-semibold text-sm">{node.name}</span>
                    <span className={`w-2 h-2 rounded-full ${node.state === 1 ? 'bg-green-500' : 'bg-red-500'}`}></span>
                </div>
                <div className="grid grid-cols-2 gap-2 text-[10px] text-slate-400 uppercase tracking-tighter">
                    <div>CPU: <span className="text-slate-200">{node.cpu}%</span></div>
                    <div>MEM: <span className="text-slate-200">{node.memory}MB</span></div>
                    <div>PLAYERS: <span className="text-slate-200">{node.players}</span></div>
                    <div>STATE: <span className="text-slate-200">{node.state === 1 ? 'READY' : 'ERROR'}</span></div>
                </div>
            </div>
        );

        const App = () => {
            const [data, setData] = useState(null);
            const [search, setSearch] = useState("");

            useEffect(() => {
                const socket = io();
                socket.on('stats', setData);
                return () => socket.disconnect();
            }, []);

            if (!data) return (
                <div className="flex items-center justify-center h-screen bg-[#0b0f1a]">
                    <div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-sky-500"></div>
                </div>
            );

            const filteredGuilds = data.allGuilds.filter(g => 
                g.name.toLowerCase().includes(search.toLowerCase())
            );

            return (
                <div className="flex h-screen w-full">
                    {/* Sidebar */}
                    <aside className="w-72 glass border-r border-slate-800/50 flex flex-col">
                        <div className="p-6 border-b border-slate-800/50 flex items-center gap-3">
                            <div className="p-2 bg-sky-500 rounded-lg text-white"><Icons.Music /></div>
                            <h1 className="font-bold text-lg tracking-tight">Bot Overseer</h1>
                        </div>
                        
                        <div className="p-4">
                            <div className="relative">
                                <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"><Icons.Search /></div>
                                <input 
                                    type="text" 
                                    placeholder="Search Guilds..." 
                                    className="w-full bg-slate-900/50 border border-slate-800 rounded-lg py-2 pl-9 pr-4 text-xs focus:outline-none focus:border-sky-500 transition-colors"
                                    value={search}
                                    onChange={(e) => setSearch(e.target.value)}
                                />
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto px-4 space-y-1 pb-6">
                            {filteredGuilds.map(guild => (
                                <button 
                                    key={guild.id} 
                                    className={`w-full flex items-center gap-3 p-2 rounded-lg transition-all hover:bg-slate-800/50 group ${guild.isActive ? 'active-glow bg-sky-500/5' : ''}`}
                                >
                                    <img src={guild.icon || 'https://cdn.discordapp.com/embed/avatars/0.png'} className="w-8 h-8 rounded-full shadow-lg" alt=""/>
                                    <div className="text-left overflow-hidden">
                                        <p className="text-sm font-medium truncate group-hover:text-sky-400 transition-colors">{guild.name}</p>
                                        <p className="text-[10px] text-slate-500">{guild.memberCount} members</p>
                                    </div>
                                    {guild.isActive && <div className="ml-auto w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse"></div>}
                                </button>
                            ))}
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 overflow-y-auto p-8 space-y-8">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <StatCard title="Total Guilds" value={data.totalGuilds} icon="LayoutGrid" color="sky" />
                            <StatCard title="Active Players" value={data.activePlayers} icon="Play" color="green" />
                            <StatCard title="Live Listeners" value={data.activeListeners.length} icon="Users" color="purple" />
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2 space-y-8">
                                <section className="space-y-4">
                                    <h2 className="text-xl font-bold flex items-center gap-2">
                                        <span className="text-sky-400"><Icons.Activity /></span>
                                        Live Activity
                                    </h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {data.activeGuilds.length > 0 ? data.activeGuilds.map(guild => {
                                            const progress = guild.durationMs > 0 ? (guild.position / guild.durationMs) * 100 : 0;
                                            return (
                                                <div key={guild.id} className="glass p-5 rounded-3xl space-y-5 relative overflow-hidden group border border-slate-800/50 hover:border-sky-500/30 transition-all">
                                                    <div className="flex items-center justify-between gap-3">
                                                        <div className="flex items-center gap-2">
                                                            <img src={guild.icon || 'https://cdn.discordapp.com/embed/avatars/0.png'} className="w-5 h-5 rounded-full" alt=""/>
                                                            <span className="text-[10px] font-semibold text-slate-400 truncate">{guild.name}</span>
                                                        </div>
                                                        <span className="px-2 py-0.5 bg-sky-500/5 text-sky-400 rounded text-[8px] font-bold uppercase tracking-tighter border border-sky-500/20">
                                                            {guild.nodeName}
                                                        </span>
                                                    </div>
                                                    
                                                    <div className="flex gap-4">
                                                        <div className="relative group/thumb">
                                                            <img 
                                                                src={guild.nowPlaying.thumbnail || 'https://via.placeholder.com/80/1e293b/sky?text=🎵'} 
                                                                className="w-24 h-24 rounded-2xl object-cover shadow-2xl bg-slate-900" 
                                                                alt=""
                                                                onError={(e) => { e.target.src = 'https://via.placeholder.com/80/1e293b/sky?text=🎵'; }}
                                                            />
                                                        </div>
                                                        <div className="flex-1 min-w-0">
                                                            <h4 className="font-bold text-base truncate leading-tight mb-1 text-white">{guild.nowPlaying.title}</h4>
                                                            <p className="text-[10px] text-slate-500 mb-3 uppercase tracking-widest font-semibold">Req: {guild.nowPlaying.requester}</p>
                                                            
                                                            <div className="space-y-1">
                                                                <div className="h-1.5 w-full bg-slate-800/50 rounded-full overflow-hidden">
                                                                    <div className="h-full bg-sky-500 transition-all duration-1000 shadow-[0_0_8px_rgba(56,189,248,0.5)]" style={{ width: `${progress}%` }}></div>
                                                                </div>
                                                                <div className="flex justify-between text-[8px] text-slate-500 font-mono">
                                                                    <span>{Math.floor(guild.position / 60000)}:{String(Math.floor((guild.position % 60000) / 1000)).padStart(2, '0')}</span>
                                                                    <span>{guild.nowPlaying.duration}</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {guild.queue && guild.queue.length > 0 && (
                                                        <div className="pt-4 border-t border-slate-800/50 space-y-2">
                                                            <p className="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Upcoming Queue</p>
                                                            <div className="space-y-1.5">
                                                                {guild.queue.map((song, i) => (
                                                                    <div key={i} className="flex items-center justify-between text-[10px] text-slate-400 bg-slate-900/30 p-1.5 rounded-lg">
                                                                        <span className="truncate pr-4">{(i+1)}. {song.title}</span>
                                                                        <span className="text-slate-600 shrink-0">{song.requester}</span>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        }) : (
                                            <div className="col-span-2 glass p-12 rounded-3xl flex flex-col items-center justify-center text-slate-500 border border-dashed border-slate-800">
                                                <div className="mb-4 opacity-20"><Icons.Music /></div>
                                                <p className="text-sm font-medium">No active sessions found across guilds</p>
                                            </div>
                                        )}
                                    </div>
                                </section>

                                <section className="space-y-4">
                                    <h2 className="text-xl font-bold flex items-center gap-2">
                                        <span className="text-purple-400"><Icons.Users /></span>
                                        Realtime Listeners
                                    </h2>
                                    <div className="glass rounded-2xl overflow-hidden">
                                        <table className="w-full text-left text-sm">
                                            <thead>
                                                <tr className="bg-slate-900/50 border-b border-slate-800/50">
                                                    <th className="p-4 font-semibold text-slate-400">User</th>
                                                    <th className="p-4 font-semibold text-slate-400">Guild</th>
                                                    <th className="p-4 font-semibold text-slate-400">Channel</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-800/50">
                                                {data.activeListeners.map(listener => (
                                                    <tr key={listener.id} className="hover:bg-slate-800/30 transition-colors">
                                                        <td className="p-4">
                                                            <div className="flex items-center gap-3">
                                                                <img src={listener.avatar} className="w-8 h-8 rounded-full border border-slate-700" alt=""/>
                                                                <span className="font-medium">{listener.username}</span>
                                                            </div>
                                                        </td>
                                                        <td className="p-4 text-slate-400">{listener.guildName}</td>
                                                        <td className="p-4">
                                                            <span className="px-2 py-1 bg-sky-500/10 text-sky-400 rounded text-[10px] font-bold uppercase tracking-widest">
                                                                {listener.channelName}
                                                            </span>
                                                        </td>
                                                    </tr>
                                                ))}
                                                {data.activeListeners.length === 0 && (
                                                    <tr>
                                                        <td colSpan="3" className="p-8 text-center text-slate-500 italic">No users in voice channels</td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </section>
                            </div>

                            <div className="space-y-8">
                                <section className="space-y-4">
                                    <h2 className="text-xl font-bold flex items-center gap-2">
                                        <span className="text-green-400"><Icons.Cpu /></span>
                                        Node Monitor
                                    </h2>
                                    <div className="space-y-3">
                                        {data.nodes.map(node => <NodeCard key={node.name} node={node} />)}
                                    </div>
                                </section>

                                <section className="glass p-6 rounded-2xl space-y-4">
                                    <h3 className="font-bold flex items-center gap-2 text-sky-400">
                                        <Icons.Info />
                                        System Status
                                    </h3>
                                    <div className="space-y-3 text-xs">
                                        <div className="flex justify-between">
                                            <span className="text-slate-400">Bot Version</span>
                                            <span className="text-slate-200">1.4.0-PRO</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-slate-400">Gateway Latency</span>
                                            <span className="text-green-400">24ms</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-slate-400">Uptime</span>
                                            <span className="text-slate-200">Live</span>
                                        </div>
                                    </div>
                                </section>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
